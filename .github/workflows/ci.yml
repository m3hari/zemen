name: CI

# Every push & PR answers one question: is the code good?
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York # a negative-UTC offset catches date bugs UTC hides
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check # typecheck + test + build, same as local
